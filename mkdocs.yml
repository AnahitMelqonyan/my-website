site_name: Anahit Melqonyan - Fab School
site_description: Fab School documentation site for Anahit Melqonyan
site_author: Anahit Melqonyan
copyright: Copyright 2026 Anahit Melqonyan - Creative Commons Attribution Non Commercial

site_url: https://anahitmelqonyan4565-bit.github.io/my-website/

theme:
  name: material
  font:
    text: Noto Sans Armenian
    code: Roboto Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
 
extra_css:
  - stylesheets/extra.css
 
markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
 
